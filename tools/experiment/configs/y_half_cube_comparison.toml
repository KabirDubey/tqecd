# The 16 y-half-cube gadgets (g01-g12, s_gate_{x,y,z}, ymem_y_init_y_meas), generated by the
# native, gen-free fixed-bulk y-half-cube circuit generator on tqec's feat/y-half-cube-additions
# branch (merged with orchestration as demo/yorchestration). The tool re-annotates each generated
# circuit with tqecd and compares against the generator's own (native) annotation.
#
# Run it against the demo/yorchestration tqec (which carries both the y-cube generator and
# orchestration), shadowing the tool's default tqec on PYTHONPATH:
#   PYTHONPATH=<tqec_yorchestration>/src python -m tools.experiment \
#       --config tools/experiment/configs/y_half_cube_comparison.toml
#
# The Y half cube is implemented only for fixed_bulk in that generator; fixed_boundary raises
# NotImplementedError and is recorded as a prep failure (documenting the coverage).
[experiment]
name = "y half cube: fixed-bulk native generator vs tqecd annotation"
inputs = ["y_half_cube"]
conventions = ["fixed_bulk", "fixed_boundary"]
ks = [1, 2, 3]
windows = [2]
predictors = ["parities", "distance"]
oracles = ["native"]
