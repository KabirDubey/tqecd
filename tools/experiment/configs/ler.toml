# Usage example: MCMC sampling (LER-vs-p + Lambda).
#
# Runs the static predictors AND, because [experiment.simulation] is enabled, a Monte-Carlo
# sinter.collect over the prepared circuits to draw a logical-error-rate-vs-p plot per gadget and a
# Lambda (Λ) error-suppression factor from the two largest k. Slower than a predictor-only run.
#
# Run it (the CLI feeds a cnot by default when only --config is given):
#   python -m tools.experiment --config tools/experiment/configs/ler.toml
# or point it at another gadget:
#   python -m tools.experiment --config tools/experiment/configs/ler.toml --gallery memory
#
# ks spans three distances so Lambda has two consecutive code distances to compare; max_errors
# lets sinter stop early once a p has enough errors, keeping the high-p points fast.
[experiment]
conventions = ["fixed_bulk"]
ks = [1, 2, 3]
windows = [2]
predictors = ["parities", "distance"]

[experiment.simulation]
enabled = true
noise_models = ["uniform_depolarizing"]
ps = [0.001, 0.003, 0.006, 0.01]
max_shots = 8000
max_errors = 200
decoders = ["pymatching"]
plot = true
lambda_factor = true
